name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-contract:
    name: Repository contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate public delivery contents
        run: ./scripts/check-public-repository.sh

  agentscope:
    name: AgentScope pinned source and Web UI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Prepare exact AgentScope source
        run: ./scripts/prepare-agentscope-source.sh .build/agentscope-source
      - name: Compile patched Python modules
        run: python -m compileall -q .build/agentscope-source/src .build/agentscope-source/examples/agent_service/main.py
      - name: Build patched AgentScope Web UI
        run: |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate
          pnpm --dir .build/agentscope-source/examples/web_ui install --frozen-lockfile
          pnpm --dir .build/agentscope-source/examples/web_ui build:frontend

  memory-lab:
    name: Talk Think Memory Lab
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: talk-think-memory-lab/pyproject.toml
      - name: Install Lab and test dependencies
        run: python -m pip install -e './talk-think-memory-lab[test]'
      - name: Run API tests
        run: python -m pytest -q talk-think-memory-lab/tests
      - name: Run ReME compatibility smoke
        run: ./scripts/verify-reme-compatibility.sh
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: talk-think-memory-lab/frontend/package-lock.json
      - name: Build Lab UI
        working-directory: talk-think-memory-lab/frontend
        run: |
          npm ci
          npm run build
