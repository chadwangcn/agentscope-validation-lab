name: OCI

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/oci.yml"
      - ".dockerignore"
      - "dependencies/**"
      - "deploy/oci/**"
      - "deploy/patches/**"
      - "scripts/prepare-agentscope-source.sh"
      - "talk-think-memory-lab/**"
  push:
    branches: [main]
    tags: ["sre-validation-zone-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: oci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: agentscope-service
            image: agentscope-validation-lab-agentscope-service
            dockerfile: deploy/oci/agentscope-service.Dockerfile
          - component: agentscope-web
            image: agentscope-validation-lab-agentscope-web
            dockerfile: deploy/oci/agentscope-web.Dockerfile
          - component: memory-lab
            image: agentscope-validation-lab-memory-lab
            dockerfile: deploy/oci/talk-think-memory-lab.Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Prepare exact AgentScope source
        run: ./scripts/prepare-agentscope-source.sh .build/agentscope-source
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute OCI tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=tag
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            io.agentscope.validation.component=${{ matrix.component }}
      - name: Build and publish OCI image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VCS_REF=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          provenance: mode=max
          sbom: true
      - name: Record immutable image result
        run: |
          {
            echo "### ${{ matrix.component }}"
            echo
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Published: \`${{ github.event_name != 'pull_request' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
